[alembic]
script_location = migrations
prepend_sys_path = .

# Закомментируйте строку ниже - Alembic будет брать URL из переменной DATABASE_URL
# sqlalchemy.url = postgresql+psycopg2://postgres:postgres@postgres:5432/neomarket_b2b

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname = 

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s